<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Pocket P2P Chat - Clean Stealth</title>
    <!-- Librería MQTT para sincronización instantánea entre celulares -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-main: #05070c;
            --bg-card: #0b111e;
            --neon-cyan: #00f0ff;
            --neon-purple: #a100ff;
            --neon-green: #39ff14;
            --neon-red: #ff3333;
            --text-main: #e2e8f0;
            --text-muted: #475569;
            --border: rgba(0, 240, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .wrapper {
            width: 100%;
            max-width: 460px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--neon-cyan);
            padding-bottom: 10px;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        /* PANEL DE ENLACE */
        .conn-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .row-inline {
            display: flex;
            gap: 8px;
        }

        input, select, textarea {
            background-color: #000;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 10px;
            color: var(--neon-green);
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"] { width: 100%; }

        input[type="text"]::placeholder {
            color: #334155;
            font-style: italic;
        }

        .btn {
            background: #000;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn.active-btn {
            border-color: var(--neon-green);
            color: var(--neon-green);
            background: rgba(57, 255, 20, 0.05);
        }

        /* VISUALIZADOR DE MENSAJES */
        .chat-box {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 240px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            max-width: 85%;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            line-height: 1.4;
            word-break: break-all;
            transition: opacity 0.4s ease;
        }

        .msg.incoming {
            background-color: #0c1524;
            border-left: 3px solid var(--neon-cyan);
            align-self: flex-start;
        }

        .msg.outgoing {
            background-color: #160f29;
            border-right: 3px solid var(--neon-purple);
            align-self: flex-end;
            text-align: right;
        }

        .msg .meta {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
        }

        /* ELEMENTOS DINÁMICOS */
        .msg .decrypt-btn {
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 6px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
            text-transform: uppercase;
        }

        .msg .countdown-indicator {
            background: rgba(255, 51, 51, 0.1);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 6px;
            display: inline-block;
            font-weight: bold;
        }

        /* CONSOLA OPERATIVA */
        .crypto-box {
            background-color: var(--bg-card);
            border: 1px solid rgba(161, 0, 255, 0.2);
            border-radius: 8px;
            padding: 12px;
        }

        .crypto-box label {
            display: block;
            font-size: 0.75rem;
            color: var(--neon-purple);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .grid-crypto-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .btn.purple { border-color: var(--neon-purple); color: var(--neon-purple); }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>[CRYPTO_POCKET_P2P]</h1>
            <p>Sala Privada Manual e Inyección de Red Silenciosa</p>
        </header>

        <!-- CANAL DE RED -->
        <div class="conn-box">
            <div style="font-size: 0.7rem; color: var(--neon-cyan); margin-bottom: 6px;">CREAR / ENLAZAR SALA PRIVADA:</div>
            <div class="row-inline">
                <input type="text" id="roomInput" placeholder="Escribe un código o canal secreto..." autocomplete="off">
                <button class="btn" id="connBtn" onclick="connectToBroker()">Conectar</button>
            </div>
            <div id="statusIndicator" style="font-size: 0.65rem; color: var(--text-muted); margin-top: 5px; text-align: center;">
                Estado: Esperando ingreso de canal...
            </div>
        </div>

        <!-- MONITOR DE COMUNICACIÓN (COMPLETAMENTE LIMPIO) -->
        <div class="chat-box" id="chatDisplay"></div>

        <!-- MÓDULO DE ENVÍO -->
        <div class="crypto-box">
            <div>
                <label>Mensaje a Transmitir</label>
                <textarea id="payloadText" rows="3" style="width:100%" placeholder="Escribe tu mensaje secreto aquí..."></textarea>
            </div>

            <div class="row-inline" style="align-items: center; justify-content: space-between;">
                <div style="width: 55%">
                    <label>Algoritmo de Envío</label>
                    <select id="algoSelect" style="width: 100%; padding: 6px;">
                        <option value="base64">Base64</option>
                        <option value="hex">Hexadecimal</option>
                        <option value="caesar">César (Rot 3)</option>
                    </select>
                </div>
                <div style="width: 40%; margin-top: 14px;">
                    <button class="btn active-btn" style="width: 100%; padding: 8px 0;" onclick="sendMessage()">⚡ TRANSMITIR</button>
                </div>
            </div>

            <div class="grid-crypto-actions">
                <button class="btn purple" onclick="processCryptoLocal('encode')">🔒 Encriptar Local</button>
                <button class="btn purple" onclick="processCryptoLocal('decode')">🔓 Desencriptar Local</button>
            </div>
        </div>
    </div>

    <script>
        let mqttClient = null;
        const myClientId = "client_" + Math.random().toString(16).substr(2, 8);

        function connectToBroker() {
            const room = document.getElementById('roomInput').value.trim();
            const status = document.getElementById('statusIndicator');
            const btn = document.getElementById('connBtn');

            if (!room) { 
                alert("ERROR: Debes definir una clave o nombre de canal para establecer el enlace."); 
                return; 
            }
            
            status.innerText = "Estableciendo enlace de red...";
            status.style.color = "var(--neon-cyan)";

            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            mqttClient.on('connect', () => {
                status.innerText = `ENLACE ACTIVO // CANAL OCULTO INTEGRADO`;
                status.style.color = "var(--neon-green)";
                btn.innerText = "Enlazado";
                btn.classList.add('active-btn');
                
                mqttClient.subscribe(`pocketsec/chat/${room}`);
            });

            mqttClient.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    if (data.type === 'chat' && data.sender !== myClientId) {
                        renderIncomingMessage(data);
                    } else if (data.type === 'destroy') {
                        executeTargetDestruction(data.id);
                    }
                } catch (e) {}
            });

            mqttClient.on('error', () => {
                status.innerText = "Error en el enlace.";
                status.style.color = "var(--neon-red)";
            });
        }

        function sendMessage() {
            const room = document.getElementById('roomInput').value.trim();
            const payload = document.getElementById('payloadText').value.trim();
            const algo = document.getElementById('algoSelect').value;

            if (!mqttClient || !mqttClient.connected) {
                alert("Primero debes ingresar y enlazar un canal privado.");
                return;
            }
            if (!payload) return;

            const uniqueMsgId = "msg_" + Math.random().toString(36).substr(2, 9) + Date.now().toString().slice(-4);

            const packet = {
                type: 'chat',
                id: uniqueMsgId,
                sender: myClientId,
                algo: algo,
                text: payload,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            mqttClient.publish(`pocketsec/chat/${room}`, JSON.stringify(packet));
            renderOutgoingMessage(packet);
            document.getElementById('payloadText').value = ""; 
        }

        function renderOutgoingMessage(data) {
            const display = document.getElementById('chatDisplay');
            const msgDiv = document.createElement('div');
            msgDiv.className = "msg outgoing";
            msgDiv.id = `target-${data.id}`;
            msgDiv.innerHTML = `
                <span class="meta">TÚ (${data.algo.toUpperCase()}) - ${data.time}</span>
                <span>${data.text}</span>
            `;
            display.appendChild(msgDiv);
            display.scrollTop = display.scrollHeight;
        }

        function renderIncomingMessage(data) {
            const display = document.getElementById('chatDisplay');
            const msgDiv = document.createElement('div');
            msgDiv.className = "msg incoming";
            msgDiv.id = `target-${data.id}`;
            
            msgDiv.setAttribute('data-id', data.id);
            msgDiv.setAttribute('data-cipher', data.text);
            msgDiv.setAttribute('data-algo', data.algo);

            msgDiv.innerHTML = `
                <span class="meta">RECIBIDO (${data.algo.toUpperCase()}) - ${data.time}</span>
                <span class="payload-body">${data.text}</span><br>
                <button class="decrypt-btn" onclick="decryptInPlace(this)">🔓 Descifrar Aquí</button>
            `;
            display.appendChild(msgDiv);
            display.scrollTop = display.scrollHeight;
        }

        function decryptInPlace(buttonElement) {
            const msgDiv = buttonElement.closest('.msg');
            const msgId = msgDiv.getAttribute('data-id');
            const encryptedText = msgDiv.getAttribute('data-cipher');
            const algo = msgDiv.getAttribute('data-algo');
            const textSpan = msgDiv.querySelector('.payload-body');
            
            let decryptedText = "";

            try {
                if (algo === 'base64') decryptedText = decodeURIComponent(escape(atob(encryptedText.trim())));
                if (algo === 'hex') {
                    const cleanHex = encryptedText.replace(/\s+/g, '');
                    let str = '';
                    for (let i = 0; i < cleanHex.length; i += 2) str += String.fromCharCode(parseInt(cleanHex.substr(i, 2), 16));
                    decryptedText = str;
                }
                if (algo === 'caesar') decryptedText = caesarCipher(encryptedText, 23);
            } catch(e) {
                alert("Error técnico al procesar la cadena cifrada.");
                return;
            }

            textSpan.innerText = decryptedText;
            textSpan.style.color = "var(--neon-green)";
            textSpan.style.fontWeight = "bold";

            let timeLeft = 20; 
            const textLength = decryptedText.length;

            if (textLength < 25) {
                timeLeft = 5;
            } else if (textLength <= 90) {
                timeLeft = 10;
            } else {
                timeLeft = 20;
            }

            buttonElement.className = "countdown-indicator";
            buttonElement.disabled = true;
            buttonElement.innerText = `⏱️ Destrucción: ${timeLeft}s`;

            const countdownInterval = setInterval(() => {
                timeLeft--;
                if(timeLeft > 0) {
                    buttonElement.innerText = `⏱️ Destrucción: ${timeLeft}s`;
                } else {
                    clearInterval(countdownInterval);
                    
                    const room = document.getElementById('roomInput').value.trim();
                    if (mqttClient && mqttClient.connected) {
                        mqttClient.publish(`pocketsec/chat/${room}`, JSON.stringify({
                            type: 'destroy',
                            id: msgId
                        }));
                    }
                    
                    executeTargetDestruction(msgId);
                }
            }, 1000);
        }

        function executeTargetDestruction(id) {
            const element = document.getElementById(`target-${id}`);
            if (element) {
                element.style.opacity = '0';
                setTimeout(() => {
                    element.remove();
                }, 400);
            }
        }

        function caesarCipher(str, shift) {
            return str.replace(/[a-z]/gi, letter => {
                const start = letter <= 'Z' ? 65 : 97;
                return String.fromCharCode(((letter.charCodeAt(0) - start + shift) % 26) + start);
            });
        }

        function processCryptoLocal(action) {
            const box = document.getElementById('payloadText');
            const algo = document.getElementById('algoSelect').value;
            if(!box.value) return;

            try {
                if (action === 'encode') {
                    if (algo === 'base64') box.value = btoa(unescape(encodeURIComponent(box.value)));
                    if (algo === 'hex') box.value = Array.from(box.value).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join(' ');
                    if (algo === 'caesar') box.value = caesarCipher(box.value, 3);
                } else {
                    if (algo === 'base64') box.value = decodeURIComponent(escape(atob(box.value.trim())));
                    if (algo === 'hex') {
                        const cleanHex = box.value.replace(/\s+/g, '');
                        let str = '';
                        for (let i = 0; i < cleanHex.length; i += 2) str += String.fromCharCode(parseInt(cleanHex.substr(i, 2), 16));
                        box.value = str;
                    }
                    if (algo === 'caesar') box.value = caesarCipher(box.value, 23);
                }
            } catch(e) {
                alert("Error en el formato de entrada.");
            }
        }
    </script>
</body>
</html>
