<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Pocket P2P Chat</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-main: #05070c;
            --bg-card: #0b111e;
            --neon-cyan: #00f0ff;
            --neon-purple: #a100ff;
            --neon-green: #39ff14;
            --text-main: #e2e8f0;
            --text-muted: #475569;
            --border: rgba(0, 240, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .wrapper {
            width: 100%;
            max-width: 460px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--neon-cyan);
            padding-bottom: 10px;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        /* PANEL DE CONEXIÓN */
        .conn-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .row-inline {
            display: flex;
            gap: 8px;
        }

        input, select, textarea {
            background-color: #000;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 10px;
            color: var(--neon-green);
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"] { width: 100%; }

        .btn {
            background: #000;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn.active-btn {
            border-color: var(--neon-green);
            color: var(--neon-green);
            background: rgba(57, 255, 20, 0.05);
        }

        /* ÁREA DE MENSAJES (CHAT) */
        .chat-box {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            max-width: 85%;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            line-height: 1.3;
        }

        .msg.incoming {
            background-color: #0c1524;
            border-left: 3px solid var(--neon-cyan);
            align-self: flex-start;
        }

        .msg.outgoing {
            background-color: #160f29;
            border-right: 3px solid var(--neon-purple);
            align-self: flex-end;
            text-align: right;
        }

        .msg .meta {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
        }

        .msg .load-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 4px;
            margin-top: 5px;
            cursor: pointer;
            display: inline-block;
        }

        /* SECCIÓN CRIPTO */
        .crypto-box {
            background-color: var(--bg-card);
            border: 1px solid rgba(161, 0, 255, 0.2);
            border-radius: 8px;
            padding: 12px;
        }

        .crypto-box label {
            display: block;
            font-size: 0.75rem;
            color: var(--neon-purple);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .grid-crypto-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .btn.purple { border-color: var(--neon-purple); color: var(--neon-purple); }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>[CRYPTO_POCKET_P2P]</h1>
            <p>Terminal de comunicación cifrada en tiempo real</p>
        </header>

        <div class="conn-box">
            <div style="font-size: 0.7rem; color: var(--neon-cyan); margin-bottom: 6px;">SALA / CANAL COMPARTIDO:</div>
            <div class="row-inline">
                <input type="text" id="roomInput" value="vincez_secure_99" placeholder="Clave de sala secreta">
                <button class="btn" id="connBtn" onclick="connectToBroker()">Conectar</button>
            </div>
            <div id="statusIndicator" style="font-size: 0.65rem; color: var(--text-muted); margin-top: 5px; text-align: center;">
                Estado: Desconectado de la red
            </div>
        </div>

        <div class="chat-box" id="chatDisplay">
            <div class="msg incoming" style="border-left-color: var(--text-muted);">
                <span class="meta">SISTEMA</span>
                Conéctate a una sala con tu compañero para sincronizar transmisiones.
            </div>
        </div>

        <div class="crypto-box">
            <div class="form-group" style="margin-bottom: 8px;">
                <label>Mensaje (Texto Claro o Código)</label>
                <textarea id="payloadText" rows="3" style="width:100%" placeholder="Escribe aquí tu texto..."></textarea>
            </div>

            <div class="row-inline" style="align-items: center; justify-content: space-between;">
                <div style="width: 60%">
                    <label>Algoritmo</label>
                    <select id="algoSelect" style="width: 100%; padding: 6px;">
                        <option value="base64">Base64</option>
                        <option value="hex">Hexadecimal</option>
                        <option value="caesar">César (Rot 3)</option>
                    </select>
                </div>
                <div style="width: 35%; margin-top: 14px;">
                    <button class="btn active-btn" style="width: 100%; padding: 8px 0;" onclick="sendMessage()">⚡ ENVIAR</button>
                </div>
            </div>

            <div class="grid-crypto-actions">
                <button class="btn purple" onclick="processCrypto('encode')">🔒 Codificar Local</button>
                <button class="btn purple" onclick="processCrypto('decode')">🔓 Decodificar Local</button>
            </div>
        </div>
    </div>

    <script>
        let mqttClient = null;
        // Generamos un ID único por dispositivo para no auto-leer nuestros propios mensajes enviados al canal
        const myClientId = "client_" + Math.random().toString(16).substr(2, 8);

        // --- CONEXIÓN AL BROKER PÚBLICO ---
        function connectToBroker() {
            const room = document.getElementById('roomInput').value.trim();
            const status = document.getElementById('statusIndicator');
            const btn = document.getElementById('connBtn');

            if (!room) { alert("Ingresa un nombre de sala"); return; }

            status.innerText = "Estableciendo enlace de red...";
            status.style.color = "var(--neon-cyan)";

            // Usamos el servidor websocket seguro y público de EMQX
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            mqttClient.on('connect', () => {
                status.innerText = `ENLACE ACTIVO // CANAL: ${room}`;
                status.style.color = "var(--neon-green)";
                btn.innerText = "Enlazado";
                btn.classList.add('active-btn');
                
                // Nos suscribimos a la sala única elegida
                mqttClient.subscribe(`pocketsec/chat/${room}`);
            });

            mqttClient.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    // Filtrar para no duplicar los mensajes que yo mismo envié
                    if (data.sender !== myClientId) {
                        renderIncomingMessage(data);
                    }
                } catch (e) {
                    // Ignorar paquetes corruptos o ajenos
                }
            });

            mqttClient.on('error', () => {
                status.innerText = "Error en el enlace de red.";
                status.style.color = "red";
            });
        }

        // --- TRANSMISIÓN DE DATOS ---
        function sendMessage() {
            const room = document.getElementById('roomInput').value.trim();
            const payload = document.getElementById('payloadText').value.trim();
            const algo = document.getElementById('algoSelect').value;

            if (!mqttClient || !mqttClient.connected) {
                alert("Primero debes presionar el botón 'Conectar' para ingresar a la red.");
                return;
            }
            if (!payload) return;

            const packet = {
                sender: myClientId,
                algo: algo,
                text: payload,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            // Publicamos el paquete en la sala común
            mqttClient.publish(`pocketsec/chat/${room}`, JSON.stringify(packet));
            
            // Renderizamos en nuestra pantalla como enviado
            renderOutgoingMessage(packet);
            document.getElementById('payloadText').value = ""; // Limpiar panel
        }

        // --- IMPRESIÓN EN TERMINAL (INTERFAZ DE USUARIO) ---
        function renderIncomingMessage(data) {
            const display = document.getElementById('chatDisplay');
            const msgDiv = document.createElement('div');
            msgDiv.className = "msg incoming";
            msgDiv.innerHTML = `
                <span class="meta">RECIBIDO (${data.algo.toUpperCase()}) - ${data.time}</span>
                <span class="payload-body">${data.text}</span><br>
                <button class="load-btn" onclick="loadToDecoder('${data.text}', '${data.algo}')">📥 Cargar en Lector</button>
            `;
            display.appendChild(msgDiv);
            display.scrollTop = display.scrollHeight;
        }

        function renderOutgoingMessage(data) {
            const display = document.getElementById('chatDisplay');
            const msgDiv = document.createElement('div');
            msgDiv.className = "msg outgoing";
            msgDiv.innerHTML = `
                <span class="meta">TÚ (${data.algo.toUpperCase()}) - ${data.time}</span>
                <span>${data.text}</span>
            `;
            display.appendChild(msgDiv);
            display.scrollTop = display.scrollHeight;
        }

        function loadToDecoder(text, algo) {
            document.getElementById('payloadText').value = text;
            document.getElementById('algoSelect').value = algo;
        }

        // --- MÓDULO CRIPTO (PROCESAMIENTO LOCAL) ---
        function processCrypto(action) {
            const box = document.getElementById('payloadText');
            const algo = document.getElementById('algoSelect').value;
            
            if(!box.value) return;

            try {
                if (action === 'encode') {
                    if (algo === 'base64') box.value = btoa(unescape(encodeURIComponent(box.value)));
                    if (algo === 'hex') box.value = Array.from(box.value).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join(' ');
                    if (algo === 'caesar') box.value = caesarCipher(box.value, 3);
                } else {
                    if (algo === 'base64') box.value = decodeURIComponent(escape(atob(box.value.trim())));
                    if (algo === 'hex') {
                        const cleanHex = box.value.replace(/\s+/g, '');
                        let str = '';
                        for (let i = 0; i < cleanHex.length; i += 2) str += String.fromCharCode(parseInt(cleanHex.substr(i, 2), 16));
                        box.value = str;
                    }
                    if (algo === 'caesar') box.value = caesarCipher(box.value, 23); // Inverso de 3 en alfabeto de 26
                }
            } catch(e) {
                alert("Error de parseo: El formato del mensaje no coincide con el algoritmo seleccionado.");
            }
        }

        function caesarCipher(str, shift) {
            return str.replace(/[a-z]/gi, letter => {
                const start = letter <= 'Z' ? 65 : 97;
                return String.fromCharCode(((letter.charCodeAt(0) - start + shift) % 26) + start);
            });
        }
    </script>
</body>
</html>
